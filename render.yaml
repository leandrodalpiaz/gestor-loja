services:
  - type: cron
    name: gestor-loja-preparar-efemerides
    runtime: docker
    schedule: "0 8 * * *"
    plan: free
    startCommand: php scripts/prepare_daily_preview.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
