services:
  - type: web
    name: gestor-loja-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    port: 80
    healthCheckPath: /health.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: FRONTEND_ALLOWED_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID_GROUP
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        sync: false
      - key: APP_LOJA_NUMERO
        sync: false
      - key: CRON_EFEMERIDES_TOKEN
        sync: false
# Crons desativados no plano Render Free (devem ser disparados via cron-job.org / monitor HTTP externo).
